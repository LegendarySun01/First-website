<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CJ Phoenix - Web Dev Task</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 90%;
            width: 400px;
        }

        h1 {
            margin-top: 0;
            font-size: 1.8rem;
        }

        p {
            line-height: 1.6;
            font-size: 1rem;
            color: #e0e0e0;
        }

        /* Floating WhatsApp Button */
        .whatsapp-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #25D366;
            color: white;
            padding: 15px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.4);
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .whatsapp-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Hello, World! 👋</h1>
        <p>Welcome to my first official web development project for the CJ Phoenix Volunteer Team. This page features a modern glassmorphism design and a live contact button.</p>
    </div>

    <a href="https://wa.me/2348131631743?text=Hi!%20I%20am%20testing%20my%20new%20website." class="whatsapp-btn" target="_blank">
        💬 WhatsApp Me
    </a>

</body>
</html>
